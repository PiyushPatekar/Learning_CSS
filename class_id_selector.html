<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="css/common.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <!-- Class Selector Example -->
     <!-- In class selector we can add one or more classes -->
    <h1 class="heading1">Hello Akshada, this side Piyush</h1>
    <h1 class="heading2">How are you?</h1>

    <h2 class="heading1">I'm doing great</h2>
    <h2 class="heading2">What about you?</h2>

    <!-- ID Selector Example -->
     <!-- In ID selector we cannot add more id's -->
     <h1 id="heading3">Welcome to PCMC</h1>
     <h1 id="heading4">Welcome to PCMC</h1>

     <!-- Id is given more priority than class.
     As if the properties get match it give priority to id and remaining will added from class. -->
     <h5 class="heading5" id="heading6">Pune is the most popular city</h5>

     <!-- Using one or more class selector -->
    <h6 class="heading_f_size h_color1 h_background h_font_family">Piyush Patekar</h6>
    <h6 class="heading_f_size h_color2 h_background h_font_family">Akshada Mune</h6>
    <h6 class="heading_f_size h_color3 h_background h_family_font">Sai Patil</h6>

</body>
</html>
